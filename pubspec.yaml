name: thereandback
description: "There and Back — a walking-journey app. Real steps move a traveler along a quest route."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  go_router: ^17.5.0
  health: ^13.3.2
  intl: ^0.20.3
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  freezed: ^4.0.0
  mocktail: ^1.0.5
  test: ^1.31.1

flutter:
  uses-material-design: true
  generate: true
