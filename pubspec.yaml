name: thereandback
description: "There and Back — a walking-journey app. Real steps move a traveler along a quest route."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  go_router: ^17.5.0
  health: ^13.3.2
  intl: ^0.20.3
  freezed_annotation: ^3.1.0
  drift: ^2.34.3
  path_provider: ^2.1.6
  path: ^1.9.1
  sqlite3: ^3.5.2
  flutter_local_notifications: ^22.3.0
  workmanager: ^0.10.9
  permission_handler: ^13.0.1
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  freezed: ^4.0.0
  mocktail: ^1.0.5
  test: ^1.31.1
  drift_dev: ^2.34.5
  fake_cloud_firestore: ^4.2.0
  firebase_auth_mocks: ^0.15.2

flutter:
  uses-material-design: true
  generate: true

  # Quest content (§4). Listed as a directory, not file by file, so dropping
  # a journey's drawn map (map.webp) into it is enough to bundle it — a
  # missing file inside a listed directory is not a build error, a missing
  # file listed by name is.
  assets:
    - assets/journeys/odyssey-ithaca/
